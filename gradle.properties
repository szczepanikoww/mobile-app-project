org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Set to false to build only the pure Kotlin modules (:contract, :shared:domain, :shared:data).
# They need nothing from Google Maven or the Android SDK, so this works on a plain JVM or a backend machine.
trainer.ui=true
