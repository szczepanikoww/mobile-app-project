# Local development database for :server (docs/features/trainer-backend.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trainer
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer-dev
    ports:
      - "5432:5432"
    volumes:
      - trainer-pg:/var/lib/postgresql/data
volumes:
  trainer-pg:
